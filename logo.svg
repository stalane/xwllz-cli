<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#14161c" />
      <stop offset="60%" stop-color="#0a0b0d" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <!-- Glow filter for the X mark -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradient for the X mark's stroke -->
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#e0e6ed" />
    </linearGradient>

    <!-- Subtle background grid pattern (wall texture) -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="50" stroke="#4a90e2" stroke-width="1" opacity="0.1" />
      <line x1="0" y1="0" x2="50" y2="0" stroke="#4a90e2" stroke-width="1" opacity="0.1" />
    </pattern>

    <!-- Smaller floating X's for dynamic scatter effect -->
    <g id="scatterX">
      <path d="M -10 -10 L 10 10 M 10 -10 L -10 10" stroke="#4a90e2" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.6" />
      <path d="M -10 -10 L 10 10 M 10 -10 L -10 10" stroke="#e0e6ed" stroke-width="1" stroke-linecap="round" />
    </g>
  </defs>

  <!-- Background Layer -->
  <rect width="500" height="500" fill="url(#bgGlow)" />
  <rect width="500" height="500" fill="url(#grid)" />

  <!-- Main X Mark -->
  <g transform="translate(250, 250)">
    <!-- Outer ambient glow rings -->
    <circle cx="0" cy="0" r="100" fill="#4a90e2" opacity="0.05" />
    <circle cx="0" cy="0" r="140" fill="#4a90e2" opacity="0.02" />

    <!-- The Main X (3 layers: glow, mid, core) -->
    <path d="M -60 -60 L 60 60 M 60 -60 L -60 60" stroke="#4a90e2" stroke-width="25" stroke-linecap="round" filter="url(#glow)" opacity="0.5" />
    <path d="M -60 -60 L 60 60 M 60 -60 L -60 60" stroke="#4a90e2" stroke-width="12" stroke-linecap="round" />
    <path d="M -60 -60 L 60 60 M 60 -60 L -60 60" stroke="url(#xGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Duplicate X for depth (behind the main X) -->
  <g transform="translate(250, 250) scale(1.3)" opacity="0.15">
    <path d="M -50 -50 L 50 50 M 50 -50 L -50 50" stroke="#4a90e2" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Duplicate X for depth (in front, offset) -->
  <g transform="translate(250, 250) scale(0.6) translate(80, -60)" opacity="0.3">
    <path d="M -60 -60 L 60 60 M 60 -60 L -60 60" stroke="#4a90e2" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- Scattered X's breaking the symmetry -->
  <use href="#scatterX" transform="translate(150, 150) rotate(15) scale(1.2)" />
  <use href="#scatterX" transform="translate(380, 120) rotate(-25) scale(1.5)" />
  <use href="#scatterX" transform="translate(120, 380) rotate(45) scale(1)" />
  <use href="#scatterX" transform="translate(400, 400) rotate(-15) scale(2)" />
  <use href="#scatterX" transform="translate(100, 250) rotate(30) scale(0.8)" opacity="0.5" />
  <use href="#scatterX" transform="translate(400, 250) rotate(-45) scale(0.9)" opacity="0.7" />

  <!-- Decorative corner X marks (ties back to the wall theme) -->
  <g opacity="0.2">
    <!-- Top Left -->
    <path d="M 30 30 L 50 50 M 50 30 L 30 50" stroke="#4a90e2" stroke-width="4" stroke-linecap="round" />
    <!-- Top Right -->
    <path d="M 450 30 L 470 50 M 470 30 L 450 50" stroke="#4a90e2" stroke-width="4" stroke-linecap="round" />
    <!-- Bottom Left -->
    <path d="M 30 450 L 50 470 M 50 450 L 30 470" stroke="#4a90e2" stroke-width="4" stroke-linecap="round" />
    <!-- Bottom Right -->
    <path d="M 450 450 L 470 470 M 470 450 L 450 470" stroke="#4a90e2" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>