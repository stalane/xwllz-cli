name: Release

# Publishes to PyPI via OIDC trusted publishing (no API token).
# PyPI project settings must list this exact publisher:
#   owner: stalane, repo: xwllz-cli, workflow: release.yml
# (no environment — keep the Environment field empty on PyPI).
# Cut a release from the GitHub UI (or: git tag vX.Y.Z && git push origin tag).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
