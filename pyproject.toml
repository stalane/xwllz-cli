[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xwllz"
version = "0.1.3"
description = "Attack-surface management for blue teams — discover, monitor, and report on your external perimeter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "blue-team", "asm", "attack-surface", "recon", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "dnspython>=2.6",
  "cryptography>=42.0",
]

[project.scripts]
xwllz = "xwllz.cli:app"

[project.urls]
Homepage = "https://xwllz.pages.dev"
Repository = "https://github.com/stalane/xwllz-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/xwllz"]

[tool.pytest.ini_options]
testpaths = ["tests"]