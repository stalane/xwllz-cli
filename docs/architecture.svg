<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14161c" />
      <stop offset="60%" stop-color="#0a0b0d" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a90e2" stop-opacity="0" />
      <stop offset="50%" stop-color="#4a90e2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4a90e2" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2" />
    </marker>
    <marker id="arrowDim" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b8f" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow)" />

  <!-- Corner X accents -->
  <g opacity="0.15" stroke="#4a90e2" stroke-width="6" stroke-linecap="round">
    <path d="M 40 40 L 80 80 M 80 40 L 40 80" />
    <path d="M 1520 40 L 1560 80 M 1560 40 L 1520 80" />
    <path d="M 40 820 L 80 860 M 80 820 L 40 860" />
    <path d="M 1520 820 L 1560 860 M 1560 820 L 1520 860" />
  </g>

  <!-- Title -->
  <text x="800" y="70" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="26" font-weight="700" letter-spacing="6" fill="#e0e6ed">HOW XWLLZ WORKS</text>
  <rect x="700" y="88" width="200" height="3" fill="url(#lineGrad)" />

  <!-- Layer 1: CLI -->
  <rect x="80" y="140" width="1440" height="120" rx="10" fill="#0a0b0d" stroke="#4a90e2" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="110" y="172" font-family="'SFMono-Regular',Consolas,monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#4a90e2">CLI</text>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="16" fill="#e0e6ed">
    <rect x="110" y="190" width="210" height="46" rx="6" fill="#14161c" stroke="#1a2a3a" />
    <text x="215" y="220" text-anchor="middle">xwllz init</text>
    <rect x="340" y="190" width="260" height="46" rx="6" fill="#14161c" stroke="#1a2a3a" />
    <text x="470" y="220" text-anchor="middle">xwllz discover</text>
    <rect x="620" y="190" width="250" height="46" rx="6" fill="#14161c" stroke="#1a2a3a" />
    <text x="745" y="220" text-anchor="middle">xwllz monitor</text>
    <rect x="890" y="190" width="250" height="46" rx="6" fill="#14161c" stroke="#1a2a3a" />
    <text x="1015" y="220" text-anchor="middle">xwllz report</text>
    <rect x="1160" y="190" width="210" height="46" rx="6" fill="#14161c" stroke="#1a2a3a" />
    <text x="1265" y="220" text-anchor="middle">xwllz intel</text>
    <rect x="1390" y="190" width="110" height="46" rx="6" fill="#14161c" stroke="#1a2a3a" />
    <text x="1445" y="220" text-anchor="middle">status</text>
  </g>

  <!-- Arrows down to engines -->
  <line x1="800" y1="262" x2="800" y2="298" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Layer 2: Engines -->
  <rect x="80" y="300" width="1440" height="200" rx="10" fill="#0a0b0d" stroke="#4a90e2" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="110" y="332" font-family="'SFMono-Regular',Consolas,monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#4a90e2">ENGINES  ·  PURE PYTHON</text>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#aab4c6">
    <rect x="110" y="350" width="330" height="120" rx="8" fill="#14161c" stroke="#1a2a3a" />
    <text x="275" y="382" text-anchor="middle" font-weight="700" fill="#e0e6ed">Subdomain harvest</text>
    <text x="275" y="410" text-anchor="middle">crt.sh cert transparency</text>
    <text x="275" y="436" text-anchor="middle">DNS brute (dnsx)</text>
    <text x="275" y="462" text-anchor="middle">+ keyed listings</text>
    <rect x="460" y="350" width="330" height="120" rx="8" fill="#14161c" stroke="#1a2a3a" />
    <text x="625" y="382" text-anchor="middle" font-weight="700" fill="#e0e6ed">DNS posture</text>
    <text x="625" y="410" text-anchor="middle">A / NS / MX resolution</text>
    <text x="625" y="436" text-anchor="middle">SPF · DMARC · DKIM checks</text>
    <text x="625" y="462" text-anchor="middle">dnspython</text>
    <rect x="810" y="350" width="330" height="120" rx="8" fill="#14161c" stroke="#1a2a3a" />
    <text x="975" y="382" text-anchor="middle" font-weight="700" fill="#e0e6ed">Port + service scan</text>
    <text x="975" y="410" text-anchor="middle">async socket scanner</text>
    <text x="975" y="436" text-anchor="middle">HTTP / HTTPS probing</text>
    <text x="975" y="462" text-anchor="middle">httpx · tech detection</text>
    <rect x="1160" y="350" width="340" height="120" rx="8" fill="#14161c" stroke="#1a2a3a" />
    <text x="1330" y="382" text-anchor="middle" font-weight="700" fill="#e0e6ed">TLS + cert inspection</text>
    <text x="1330" y="410" text-anchor="middle">expiry · SAN · issuer</text>
    <text x="1330" y="436" text-anchor="middle">ssl + cryptography</text>
    <text x="1330" y="462" text-anchor="middle">hostname mismatch checks</text>
  </g>

  <!-- Optional accelerators side panel -->
  <rect x="80" y="520" width="700" height="120" rx="10" fill="#0a0b0d" stroke="#5c6b8f" stroke-dasharray="6 4" stroke-width="1.5" />
  <text x="110" y="552" font-family="'SFMono-Regular',Consolas,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#5c6b8f">OPTIONAL ACCELERATORS · AUTO-DETECTED</text>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="14" fill="#aab4c6">
    <text x="110" y="590">nmap · masscan · rustscan  →  faster port scans</text>
    <text x="110" y="618">nuclei  →  vulnerability templates</text>
    <text x="520" y="590">httpx · dnsx · dig · whatweb</text>
    <text x="520" y="618">present on PATH? used automatically</text>
  </g>

  <!-- Keyed sources panel -->
  <rect x="800" y="520" width="720" height="120" rx="10" fill="#0a0b0d" stroke="#4a90e2" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="830" y="552" font-family="'SFMono-Regular',Consolas,monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#4a90e2">KEYED ENRICHMENT · OPTIONAL</text>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="14" fill="#aab4c6">
    <text x="830" y="590">Shodan   SecurityTrails   Censys</text>
    <text x="830" y="618">URLhaus · urlscan · VirusTotal  →  xwllz intel</text>
  </g>

  <!-- Arrow down to storage -->
  <line x1="800" y1="642" x2="800" y2="672" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Layer 3: Storage -->
  <rect x="80" y="674" width="1440" height="90" rx="10" fill="#0a0b0d" stroke="#4a90e2" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="110" y="710" font-family="'SFMono-Regular',Consolas,monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#4a90e2">SQLITE STORE</text>
  <text x="110" y="740" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" fill="#aab4c6">orgs · assets · services · findings · snapshots · intel   —   ~/.local/share/xwllz/xwllz.db</text>

  <!-- Arrow down to output -->
  <line x1="800" y1="766" x2="800" y2="796" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Layer 4: Output -->
  <rect x="80" y="798" width="1440" height="82" rx="10" fill="#0a0b0d" stroke="#4a90e2" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="110" y="834" font-family="'SFMono-Regular',Consolas,monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#4a90e2">OUTPUT</text>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="16" fill="#e0e6ed">
    <rect x="420" y="812" width="200" height="50" rx="6" fill="#14161c" stroke="#1a2a3a" />
    <text x="520" y="843" text-anchor="middle">markdown</text>
    <rect x="650" y="812" width="200" height="50" rx="6" fill="#14161c" stroke="#1a2a3a" />
    <text x="750" y="843" text-anchor="middle">JSON</text>
    <rect x="880" y="812" width="200" height="50" rx="6" fill="#14161c" stroke="#1a2a3a" />
    <text x="980" y="843" text-anchor="middle">HTML</text>
  </g>

  <rect x="660" y="840" width="280" height="3" fill="url(#lineGrad)" opacity="0" />
</svg>